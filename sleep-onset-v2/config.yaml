experiment:
  name: spectral_cnn_gru_v2
  seed: 42
model:
  n_chans: 4
  cnn_embedding: 128
  spectral_embedding: 64
  gru_hidden: 128
  gru_layers: 1
  dropout: 0.25
  sampling_rate: 128.0
  n_times: 640
data:
  window_seconds: 5.0
  sequence_length: 24
  input_channels: 4
  channel_names: [TP9, AF7, AF8, TP10]
training:
  max_epochs: 25
  batch_size: 16
  learning_rate: 0.0005
  weight_decay: 0.0001
  gradient_clip: 1.0
  early_stopping_patience: 6
  num_workers: 0
  time_budget_hours: 4.75
  diagnostic_batches: 1
references:
  v1_validation_wbmae: 43.0692
  v1_codabench_wbmae: 55.0472
